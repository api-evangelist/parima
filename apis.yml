name: Parima
description: >-
  PARIMA is a protein-innovation company that develops high-quality cultivated
  foods directly from animal cells, formed from the combination of Gourmey and
  Vital Meat. It combines expertise in cell cultivation, bioprocessing, and
  culinary development to produce cultivated meat at scale, and in October 2025
  became the first European company granted regulatory approval for cultivated
  protein. Its culinary brand, Gourmey, focuses on premium cultivated meats
  co-developed with Michelin-starred chefs. Surfaced as an Earlybird portfolio
  company and added to the API Evangelist network; it publishes no public API,
  developer platform, or software product surface as of this enrichment pass.
